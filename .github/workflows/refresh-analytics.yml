name: Refresh analytics snapshot

# The dashboard reads a committed JSON file rather than calling Cloudflare from
# the page, because this repo is public and anything the page can read, anyone
# can read. This job is what keeps that file current.

on:
  schedule:
    # 12:17 UTC daily, a little past the hour to avoid GitHub's top-of-hour queue.
    - cron: '17 12 * * *'
  workflow_dispatch:        # a Run workflow button, for refreshing on demand

permissions:
  contents: write           # the job commits the refreshed snapshot back

concurrency:
  group: refresh-analytics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Fetch from Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set. Add it under"
            echo "::error::Settings > Secrets and variables > Actions."
            exit 1
          fi
          python3 .github/scripts/fetch_analytics.py \
            --days 30 --out siteanalytics/data.json

      - name: Commit if the numbers moved
        run: |
          if git diff --quiet -- siteanalytics/data.json; then
            echo "No change in the numbers; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add siteanalytics/data.json
          git commit -m "Refresh analytics snapshot"
          git push
